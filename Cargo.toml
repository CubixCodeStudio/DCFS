[workspace]
resolver = "2"
members = [
    "crates/dcfs-core",
    "crates/dcfs-objectstore",
    "crates/dcfs-crypto",
    "crates/dcfs-protocol",
    "crates/dcfs-db",
    "crates/dcfs-server",
    "crates/dcfs-cache",
    "crates/dcfs-fuse",
    "crates/dcfs-discord",
    "crates/dcfs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# Internal crates
dcfs-core = { path = "crates/dcfs-core" }
dcfs-objectstore = { path = "crates/dcfs-objectstore" }
dcfs-crypto = { path = "crates/dcfs-crypto" }
dcfs-protocol = { path = "crates/dcfs-protocol" }
dcfs-db = { path = "crates/dcfs-db" }
dcfs-cache = { path = "crates/dcfs-cache" }
dcfs-discord = { path = "crates/dcfs-discord" }

# External dependencies
tokio = { version = "1.36", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
blake3 = "1.5"
chacha20poly1305 = "0.10"
base64 = "0.21"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
bytes = "1.5"
fuser = "0.14"
prometheus = "0.13"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
parking_lot = "0.12"

[profile.release]
lto = true
codegen-units = 1
