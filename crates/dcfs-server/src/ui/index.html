<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCFS</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff; --fg: #1a1a1a; --muted: #666; --line: #e3e3e3;
    --accent: #2d6cdf; --danger: #c0392b; --row: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181d; --fg: #e8e8e8; --muted: #9aa0a6; --line: #2c2f36;
            --accent: #6ea8fe; --danger: #e06c5d; --row: #1c1f25; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5
         system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
           border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line);
           background: var(--bg); color: var(--fg); border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.link { border: none; background: none; color: var(--accent); padding: 2px 6px; }
  button.link.danger { color: var(--danger); }
  input[type=password], input[type=text] { font: inherit; padding: 8px 10px;
           border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
           color: var(--fg); min-width: 280px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  tr:hover td { background: var(--row); }
  td.size, td.when { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.actions { text-align: right; white-space: nowrap; }
  .name { background: none; border: none; color: inherit; font: inherit;
          cursor: pointer; padding: 0; text-align: left; }
  .name:hover { color: var(--accent); }
  nav { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; color: var(--muted); }
  nav button { border: none; background: none; color: var(--accent); padding: 2px 4px; }
  #drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px;
          text-align: center; color: var(--muted); margin-bottom: 16px; }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  #status { padding: 8px 16px; font-size: 14px; }
  #status.error { color: var(--danger); }
  progress { width: 100%; height: 6px; }
  .grow { flex: 1; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  form.login { max-width: 420px; margin: 12vh auto; display: grid; gap: 12px; }
  form.login p { color: var(--muted); margin: 0; font-size: 14px; }
</style>
</head>
<body>

<div id="app"></div>
<div id="status"></div>

<script>
const $ = (sel) => document.querySelector(sel);
const app = $("#app"), statusBar = $("#status");
let chunkSize = 8 << 20;
let trail = [];               // [{id, name}] from root to here

const b64 = {
  encode: (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""),
  decode: (s) => {
    const padded = s.replace(/-/g, "+").replace(/_/g, "/");
    const bytes = Uint8Array.from(atob(padded), (c) => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  },
};

function say(message, isError) {
  statusBar.textContent = message || "";
  statusBar.className = isError ? "error" : "";
}

// Every request carries the session cookie; nothing here ever holds the token.
async function api(path, options = {}) {
  const response = await fetch("/api/v1" + path, { credentials: "same-origin", ...options });
  if (response.status === 401) { showLogin(); throw new Error("unauthorized"); }
  if (!response.ok) throw new Error(await response.text() || response.statusText);
  return response;
}
const json = async (path, options) => (await api(path, options)).json();

const uuid = () => crypto.randomUUID();
const size = (n) => {
  if (n < 1024) return n + " B";
  const units = ["KB", "MB", "GB", "TB"];
  let value = n / 1024, unit = 0;
  while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
  return value.toFixed(value < 10 ? 1 : 0) + " " + units[unit];
};
const when = (iso) => new Date(iso).toLocaleString();

function showLogin() {
  app.innerHTML = `
    <form class="login">
      <h1>DCFS</h1>
      <p>ใส่ API token เพื่อเข้าใช้งาน</p>
      <input type="password" id="token" placeholder="API token" autocomplete="current-password" required>
      <button class="primary" type="submit">เข้าสู่ระบบ</button>
    </form>`;
  $("form.login").onsubmit = async (event) => {
    event.preventDefault();
    say("");
    const response = await fetch("/ui/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ token: $("#token").value }),
    });
    if (response.ok) { trail = []; await start(); }
    else say("token ไม่ถูกต้อง", true);
  };
}

async function start() {
  const info = await json("/fs");
  chunkSize = info.chunk_size || chunkSize;
  if (trail.length === 0) {
    const root = await json("/nodes/root");
    trail = [{ id: root.id, name: "/" }];
  }
  render();
}

async function render() {
  const here = trail[trail.length - 1];
  const listing = await json(`/nodes/${here.id}/children?limit=1000`);
  const rows = listing.children
    .map((node) => ({ ...node, label: b64.decode(node.name) }))
    .sort((a, b) => (a.kind === b.kind)
      ? a.label.localeCompare(b.label)
      : (a.kind === "Directory" ? -1 : 1));

  app.innerHTML = `
    <header>
      <h1>DCFS</h1>
      <nav id="crumbs"></nav>
      <span class="grow"></span>
      <button id="mkdir">โฟลเดอร์ใหม่</button>
      <button class="primary" id="pick">อัปโหลด</button>
      <button id="signout">ออก</button>
      <input type="file" id="files" multiple hidden>
    </header>
    <main>
      <div id="drop">ลากไฟล์มาวางที่นี่</div>
      ${rows.length === 0 ? '<p class="empty">ว่างเปล่า</p>' : `
      <table>
        <thead><tr><th>ชื่อ</th><th>ขนาด</th><th>แก้ไขล่าสุด</th><th></th></tr></thead>
        <tbody></tbody>
      </table>`}
    </main>`;

  const crumbs = $("#crumbs");
  trail.forEach((step, index) => {
    if (index > 0) crumbs.append(" / ");
    const button = document.createElement("button");
    button.textContent = step.name;
    button.onclick = () => { trail = trail.slice(0, index + 1); render(); };
    crumbs.append(button);
  });

  const body = app.querySelector("tbody");
  for (const node of rows) {
    const tr = document.createElement("tr");

    const nameCell = document.createElement("td");
    const isDir = node.kind === "Directory";
    const name = document.createElement("button");
    name.className = "name";
    name.textContent = (isDir ? "📁 " : "📄 ") + node.label;
    name.onclick = () => isDir
      ? (trail.push({ id: node.id, name: node.label }), render())
      : download(node);
    nameCell.append(name);

    const sizeCell = document.createElement("td");
    sizeCell.className = "size";
    sizeCell.textContent = isDir ? "" : size(node.size);

    const whenCell = document.createElement("td");
    whenCell.className = "when";
    whenCell.textContent = when(node.mtime);

    const actions = document.createElement("td");
    actions.className = "actions";
    const rename = document.createElement("button");
    rename.className = "link";
    rename.textContent = "เปลี่ยนชื่อ";
    rename.onclick = () => renameNode(node);
    const remove = document.createElement("button");
    remove.className = "link danger";
    remove.textContent = "ลบ";
    remove.onclick = () => removeNode(node);
    actions.append(rename, remove);

    tr.append(nameCell, sizeCell, whenCell, actions);
    body.append(tr);
  }

  $("#pick").onclick = () => $("#files").click();
  $("#files").onchange = (event) => upload([...event.target.files]);
  $("#mkdir").onclick = mkdir;
  $("#signout").onclick = async () => {
    await fetch("/ui/logout", { method: "POST", credentials: "same-origin" });
    showLogin();
  };

  const drop = $("#drop");
  drop.ondragover = (event) => { event.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (event) => {
    event.preventDefault();
    drop.classList.remove("over");
    upload([...event.dataTransfer.files]);
  };
}

async function mkdir() {
  const label = prompt("ชื่อโฟลเดอร์");
  if (!label) return;
  try {
    await api("/nodes", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        parent_id: trail[trail.length - 1].id, name: b64.encode(label),
        kind: "Directory", mode: 0o40755, uid: 0, gid: 0, idempotency_key: uuid(),
      }),
    });
    say("");
    render();
  } catch (e) { say(String(e.message), true); }
}

async function renameNode(node) {
  const label = prompt("ชื่อใหม่", node.label);
  if (!label || label === node.label) return;
  try {
    await api(`/nodes/${node.id}/rename`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        new_parent_id: trail[trail.length - 1].id,
        new_name: b64.encode(label), idempotency_key: uuid(),
      }),
    });
    say("");
    render();
  } catch (e) { say(String(e.message), true); }
}

async function removeNode(node) {
  // Says what actually happens: unlinking hides it now, and the bytes go when
  // the collector next runs past the retention window.
  if (!confirm(`ลบ "${node.label}" ?\n\nไฟล์จะหายทันที ส่วนข้อมูลบน backend จะถูกเก็บกวาดภายหลัง`)) return;
  try {
    await api(`/nodes/${node.id}`, { method: "DELETE" });
    say("");
    render();
  } catch (e) { say(String(e.message), true); }
}

function download(node) {
  // A plain navigation, so the browser streams it to disk rather than holding
  // a whole file in memory first. The cookie goes with it.
  const link = document.createElement("a");
  link.href = `/api/v1/nodes/${node.id}/data`;
  link.download = node.label;
  link.click();
}

async function upload(files) {
  for (const file of files) {
    try {
      const parent = trail[trail.length - 1].id;
      const created = await json("/nodes", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          parent_id: parent, name: b64.encode(file.name), kind: "File",
          mode: 0o100644, uid: 0, gid: 0, idempotency_key: uuid(),
        }),
      });

      // One part per request, the same size the server stores them in, so a
      // large file does not have to be held in memory all at once.
      for (let offset = 0; offset < file.size; offset += chunkSize) {
        const slice = file.slice(offset, Math.min(offset + chunkSize, file.size));
        await api(`/nodes/${created.id}/data?offset=${offset}`, {
          method: "PUT", body: slice,
        });
        const done = Math.min(offset + chunkSize, file.size);
        say(`${file.name}: ${size(done)} / ${size(file.size)}`);
      }
      // Closing the file is what commits it.
      await api(`/nodes/${created.id}/sync`, { method: "POST" });
      say(`${file.name}: เสร็จ`);
    } catch (e) {
      say(`${file.name}: ${e.message}`, true);
    }
  }
  render();
}

start().catch(() => showLogin());
</script>
</body>
</html>
